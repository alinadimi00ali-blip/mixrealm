<div class="container">
  <header>
    <h1>🎶 MixRealm</h1>
    <img src="logo.png" alt="Logo" class="logo">
  </header>

  <h2 id="track-title">Track Title</h2>
  <audio id="audio" controls>
    <source src="tracks/your-music.mp3" type="audio/mp3">
  </audio>

  <div class="controls">
    <button onclick="prevTrack()">⏮</button>
    <button onclick="playPause()">▶️</button>
    <button onclick="nextTrack()">⏭</button>
  </div>

  <!-- ویژوالایزر -->
  <div id="visualizer">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>
</div>
