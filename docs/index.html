<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MixRealm Player</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>🎶 MixRealm</h1>
    </header>

    <main>
      <div class="player-card">
        <img src="img/logo.png" alt="Cover" class="cover-art" />
        <h2 id="track-title">Track Title</h2>
        <audio id="audio" controls>
          <source src="media/sample.mp3" type="audio/mpeg">
          مرورگر شما از پلیر صوتی پشتیبانی نمی‌کند.
        </audio>
        <div class="controls">
          <button id="prev"><i class="fas fa-backward"></i></button>
          <button id="play"><i class="fas fa-play"></i></button>
          <button id="next"><i class="fas fa-forward"></i></button>
        </div>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
